<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>ZH Api</title>
    <meta name="title" content="ZH Api" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f1f2eb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#090c0b"
    />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <script>
      // Resolve theme before first paint so the page never flashes the wrong
      // background. Mirrors ThemeProvider / ThemeCustomizationProvider:
      // - mode: stored 'dark' | 'light' | 'system'; default 'dark'
      // - preset: stored preset id; default 'relaydesk' (has its own CSS
      //   block, so the body attribute must exist before styled content)
      // The Mobius homepage is always dark.
      try {
        var pathname = window.location.pathname
        var dark
        if (pathname === '/' || pathname === '/index.html') {
          dark = true
        } else {
          var mode = window.localStorage.getItem('newapi:theme:v1:mode')
          dark =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : mode !== 'light'
        }
        document.documentElement.classList.add(dark ? 'dark' : 'light')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        var preset = window.localStorage.getItem('newapi:theme:v1:preset')
        var VALID_PRESETS = {
          default: 1,
          anthropic: 1,
          'simple-large': 1,
          underground: 1,
          'rose-garden': 1,
          'lake-view': 1,
          'sunset-glow': 1,
          'forest-whisper': 1,
          'ocean-breeze': 1,
          'lavender-dream': 1,
          relaydesk: 1,
        }
        if (!preset || !VALID_PRESETS[preset]) {
          preset = 'relaydesk'
        }
        document.body.dataset.themePreset = preset
      } catch (error) {}
    </script>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
